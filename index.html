<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>Riga — Waze</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f5;
      --surface: #fff;
      --text: #20251f;
      --muted: #788078;
      --line: #e6e9e4;
      --accent: #286b52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100% - 32px, 440px); margin: 0 auto; padding: 38px 0 48px; }
    header { margin-bottom: 30px; }
    h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -1px; }
    header p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    h2 { margin: 0 0 12px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .spot, .saved-place {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      text-align: left;
    }
    .spot { padding: 0 13px; cursor: pointer; transition: border-color .15s, transform .15s; }
    .spot:hover { border-color: #b7c8bc; }
    .spot:active { transform: scale(.98); }
    section + section { margin-top: 30px; }
    form { display: flex; gap: 8px; }
    input {
      min-width: 0;
      flex: 1;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: #9aa19a; }
    .add {
      width: 46px;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 22px;
      cursor: pointer;
    }
    .saved { display: grid; gap: 8px; margin-top: 8px; }
    .saved-place { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; }
    .saved-place button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .saved-place .remove { color: var(--muted); font-size: 18px; padding: 4px; }
    .empty { color: var(--muted); font-size: 13px; padding: 5px 0; }
    @media (max-width: 340px) { main { width: calc(100% - 24px); } .grid { gap: 6px; } .spot { padding: 0 9px; font-size: 13px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Riga</h1>
      <p>Choose a place to navigate with Waze</p>
    </header>

    <section aria-labelledby="popular-title">
      <h2 id="popular-title">Popular places</h2>
      <div class="grid" id="popular"></div>
    </section>

    <section aria-labelledby="saved-title">
      <h2 id="saved-title">Your places</h2>
      <form id="add-form">
        <input id="address" type="text" placeholder="Add an address" aria-label="Address to save" maxlength="120" required>
        <button class="add" type="submit" aria-label="Save address">+</button>
      </form>
      <div class="saved" id="saved"></div>
    </section>
  </main>

  <script>
    const spots = [
      ['Old Town', '56.9496,24.1052'],
      ['Central Station', '56.9487,24.1145'],
      ['Dome Square', '56.9491,24.1053'],
      ['Freedom Monument', '56.9526,24.1169'],
      ['Vērmanes Garden', '56.9556,24.1128'],
      ['Arena Riga', '56.9601,24.1204'],
      ['Riga Airport', '56.9221,23.9711'],
      ['Central Market', '56.9437,24.1135']
    ];
    const key = 'riga-waze-places';
    const popular = document.getElementById('popular');
    const saved = document.getElementById('saved');

    function navigate(query) {
      window.location.href = 'https://www.waze.com/ul?ll=' + encodeURIComponent(query) + '&navigate=yes';
    }

    spots.forEach(([name, location]) => {
      const button = document.createElement('button');
      button.className = 'spot';
      button.type = 'button';
      button.textContent = name;
      button.addEventListener('click', () => navigate(location));
      popular.appendChild(button);
    });

    function getPlaces() {
      try { return JSON.parse(localStorage.getItem(key) || '[]'); }
      catch { return []; }
    }

    function renderPlaces() {
      saved.replaceChildren();
      const places = getPlaces();
      if (!places.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No saved addresses';
        saved.appendChild(empty);
        return;
      }
      places.forEach((address, index) => {
        const row = document.createElement('div');
        row.className = 'saved-place';
        const label = document.createElement('span');
        label.textContent = address;
        const go = document.createElement('button');
        go.type = 'button';
        go.textContent = 'Go';
        go.addEventListener('click', () => navigate(address));
        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.type = 'button';
        remove.textContent = '×';
        remove.setAttribute('aria-label', 'Remove ' + address);
        remove.addEventListener('click', () => {
          const updated = getPlaces();
          updated.splice(index, 1);
          localStorage.setItem(key, JSON.stringify(updated));
          renderPlaces();
        });
        row.append(label, go, remove);
        saved.appendChild(row);
      });
    }

    document.getElementById('add-form').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('address');
      const address = input.value.trim();
      if (!address) return;
      const places = getPlaces();
      places.unshift(address);
      localStorage.setItem(key, JSON.stringify(places.slice(0, 10)));
      input.value = '';
      renderPlaces();
    });

    renderPlaces();
  </script>
</body>
</html>
