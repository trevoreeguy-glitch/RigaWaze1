<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1016">
  <title>Riga — Waze</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1016;
      --bg-2: #111b26;
      --surface: #121b25;
      --surface-alt: #182437;
      --text: #edf2f8;
      --muted: #9aa8bc;
      --line: #243448;
      --accent: #f5c94c;
      --accent-soft: rgba(245, 201, 76, 0.14);
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #121d2b 0%, var(--bg) 38%, #070b10 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100% - 24px, 540px);
      margin: 0 auto;
      padding: 32px 0 44px;
    }

    header { margin-bottom: 26px; }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      letter-spacing: -1.1px;
      font-weight: 700;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .section-note {
      margin: -5px 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .spot, .saved-place {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(18, 27, 37, 0.95), rgba(14, 20, 29, 0.98));
      color: var(--text);
      box-shadow: 0 8px 22px var(--shadow);
    }

    .spot {
      min-height: 76px;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      font: inherit;
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }

    .spot:hover, .spot:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(245, 201, 76, 0.12);
      outline: none;
    }

    .spot:active { transform: scale(.98); }

    .spot-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .eta {
      font-size: 11px;
      font-weight: 700;
      color: #f2d064;
      background: var(--accent-soft);
      border-radius: 999px;
      display: inline-block;
      width: fit-content;
      padding: 4px 8px;
    }

    section + section { margin-top: 28px; }

    .form-wrap { display: flex; gap: 8px; }

    input {
      flex: 1;
      min-width: 0;
      height: 46px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 12px;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }
    input::placeholder { color: #75839a; }

    .add {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffd76a, #f7c94b);
      color: #1a1200;
      font-size: 25px;
      cursor: pointer;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(245, 201, 76, 0.2);
    }

    .saved { margin-top: 10px; display: grid; gap: 8px; }

    .saved-place {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 52px;
      padding: 10px 12px;
    }

    .saved-main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .saved-address {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .go-btn, .remove-btn {
      border: 0;
      background: none;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .go-btn { color: var(--accent); font-size: 13px; font-weight: 700; }
    .remove-btn { color: var(--muted); font-size: 20px; line-height: 1; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 2px 0; }

    @media (max-width: 350px) {
      main { width: calc(100% - 20px); }
      .grid { grid-template-columns: 1fr; }
      .saved-place { padding: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Riga</h1>
      <p class="subtitle">ETA from your current location</p>
    </header>

    <section aria-labelledby="popular-title">
      <h2 id="popular-title">Popular hot spots</h2>
      <p class="section-note">Move to these busy areas between rides to catch the next order faster.</p>
      <div class="grid" id="popular"></div>
    </section>

    <section aria-labelledby="saved-title">
      <h2 id="saved-title">Your places</h2>
      <div class="form-wrap">
        <input id="address" type="text" placeholder="Add an address" maxlength="120" aria-label="Address to save" />
        <button class="add" type="button" id="saveBtn" aria-label="Save address">+</button>
      </div>
      <div class="saved" id="saved"></div>
    </section>
  </main>

  <script>
    const popularSpots = [
      { name: 'Old Town', lat: 56.9496, lng: 24.1052 },
      { name: 'Central Station', lat: 56.9487, lng: 24.1145 },
      { name: 'Riga Airport', lat: 56.9221, lng: 23.9711 },
      { name: 'Central Market', lat: 56.9437, lng: 24.1135 },
      { name: 'Dome Square', lat: 56.9491, lng: 24.1053 },
      { name: 'Freedom Monument', lat: 56.9526, lng: 24.1169 },
      { name: 'Latgale Market', lat: 56.9548, lng: 24.1324 },
      { name: 'Arena Riga', lat: 56.9601, lng: 24.1204 },
      { name: 'Riga Bus Station', lat: 56.9447, lng: 24.1133 },
      { name: 'Vērmanes Garden', lat: 56.9556, lng: 24.1128 },
      { name: 'Spice Shopping Centre', lat: 56.9234, lng: 24.0447 },
      { name: 'Akropole Riga', lat: 56.9068, lng: 24.1735 },
      { name: 'Riga Plaza', lat: 56.9213, lng: 24.1036 },
      { name: 'Galleria Riga', lat: 56.9548, lng: 24.1175 },
      { name: 'Alfa Shopping Centre', lat: 56.9847, lng: 24.2036 },
      { name: 'Mežaparks', lat: 57.0005, lng: 24.1594 },
      { name: 'Imanta', lat: 56.9513, lng: 24.0402 },
      { name: 'Ķengarags', lat: 56.9187, lng: 24.2348 },
      { name: 'Pļavnieki', lat: 56.9655, lng: 24.1474 },
      { name: 'Teika', lat: 56.9847, lng: 24.1836 },
      { name: 'Skanste', lat: 56.9427, lng: 24.1299 },
      { name: 'Torņakalns', lat: 56.9603, lng: 24.1599 },
      { name: 'Purvciems', lat: 56.9608, lng: 24.2029 },
      { name: 'Bolderāja', lat: 57.0301, lng: 24.0805 },
      { name: 'Kipsala', lat: 56.9589, lng: 24.0827 },
      { name: 'Mīlgrāvis', lat: 56.9046, lng: 24.2262 },
      { name: 'Sarkandaugava', lat: 56.9502, lng: 24.2041 },
      { name: 'Jugla', lat: 56.9759, lng: 24.2558 },
      { name: 'Maskavas Forštate', lat: 56.9504, lng: 24.1397 },
      { name: 'Aizkraukle Highway', lat: 56.9322, lng: 24.1557 }
    ];

    const STORAGE_KEY = 'riga-waze-saved';
    const currentLocation = { lat: null, lng: null, ready: false };

    function getSavedPlaces() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const items = raw ? JSON.parse(raw) : [];
        return items.filter(Boolean).map(item => typeof item === 'string' ? { address: item, lat: null, lng: null } : item);
      } catch {
        return [];
      }
    }

    function saveSavedPlaces(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function toRadians(value) {
      return value * Math.PI / 180;
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function estimateMinutes(lat1, lon1, lat2, lon2) {
      if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
      const km = distanceKm(lat1, lon1, lat2, lon2);
      const avgSpeedKmh = 28;
      const mins = (km / avgSpeedKmh) * 60;
      return Math.max(3, Math.round(mins));
    }

    function formatEta(minutes) {
      if (minutes == null) return 'ETA unavailable';
      return `~${minutes} min`;
    }

    function getPlaceEta(lat, lng) {
      if (!currentLocation.ready || currentLocation.lat == null || currentLocation.lng == null) return null;
      return estimateMinutes(currentLocation.lat, currentLocation.lng, lat, lng);
    }

    function renderPopular() {
      const el = document.getElementById('popular');
      el.innerHTML = '';

      popularSpots.forEach(place => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'spot';
        btn.addEventListener('click', () => openWaze(place.lat, place.lng, place.name));

        const name = document.createElement('span');
        name.className = 'spot-name';
        name.textContent = place.name;

        const eta = document.createElement('span');
        eta.className = 'eta';
        eta.textContent = formatEta(getPlaceEta(place.lat, place.lng));

        btn.appendChild(name);
        btn.appendChild(eta);
        el.appendChild(btn);
      });
    }

    function renderSaved() {
      const el = document.getElementById('saved');
      const items = getSavedPlaces();
      el.innerHTML = '';

      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No saved addresses';
        el.appendChild(empty);
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'saved-place';

        const main = document.createElement('div');
        main.className = 'saved-main';

        const address = document.createElement('div');
        address.className = 'saved-address';
        address.textContent = item.address;

        const eta = document.createElement('span');
        eta.className = 'eta';
        eta.textContent = formatEta(getPlaceEta(item.lat, item.lng));

        main.appendChild(address);
        main.appendChild(eta);

        const actions = document.createElement('div');
        actions.className = 'saved-actions';

        const go = document.createElement('button');
        go.type = 'button';
        go.className = 'go-btn';
        go.textContent = 'Go';
        go.addEventListener('click', () => openWaze(item.lat, item.lng, item.address));

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-btn';
        remove.textContent = '×';
        remove.setAttribute('aria-label', 'Remove address');
        remove.addEventListener('click', () => {
          const fresh = getSavedPlaces();
          fresh.splice(index, 1);
          saveSavedPlaces(fresh);
          renderSaved();
        });

        actions.appendChild(go);
        actions.appendChild(remove);
        row.appendChild(main);
        row.appendChild(actions);
        el.appendChild(row);
      });
    }

    function openWaze(lat, lng, query) {
      const hasCoords = lat != null && lng != null;
      const wazeUrl = hasCoords
        ? `https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes&zoom=17`
        : `https://www.waze.com/ul?q=${encodeURIComponent(query)}&navigate=yes`;

      window.open(wazeUrl, '_blank');
    }

    async function geocodeAddress(address) {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(address)}`;
      const response = await fetch(url, {
        headers: { 'Accept-Language': 'en' }
      });
      const data = await response.json();
      if (!data || !data.length) return { lat: null, lng: null };
      return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
    }

    async function saveAddress() {
      const input = document.getElementById('address');
      const value = input.value.trim();
      if (!value) return;

      const coords = await geocodeAddress(value);
      const item = { address: value, lat: coords.lat, lng: coords.lng };
      const saved = getSavedPlaces();
      saved.unshift(item);
      saveSavedPlaces(saved.slice(0, 10));
      input.value = '';
      renderSaved();
    }

    function updateLocation(position) {
      currentLocation.lat = position.coords.latitude;
      currentLocation.lng = position.coords.longitude;
      currentLocation.ready = true;
      renderPopular();
      renderSaved();
    }

    function locationFailed() {
      currentLocation.ready = false;
      renderPopular();
      renderSaved();
    }

    function requestLocation() {
      if (!navigator.geolocation) {
        locationFailed();
        return;
      }

      navigator.geolocation.getCurrentPosition(updateLocation, locationFailed, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 300000
      });
    }

    document.getElementById('saveBtn').addEventListener('click', saveAddress);
    document.getElementById('address').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        saveAddress();
      }
    });

    renderPopular();
    renderSaved();
    requestLocation();
  </script>
</body>
</html>
